name: build-test
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            cxxflags: ""
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + raylib Linux deps (GLFW/X11)
        # WHY here, not in CMake: system display libs cannot come from FetchContent.
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libc++-18-dev libc++abi-18-dev gcc-13 g++-13
          libasound2-dev libx11-dev libxrandr-dev libxi-dev
          libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
          libwayland-dev libxkbcommon-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (windowed golden runs under xvfb)
        env:
          CLANK_WINDOWED_TEST: 1
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke (dump + shot)
        run: |
          ./build/clank --headless --shot-after 60 --dump-scene /tmp/scene.json --seed 42
          test -f /tmp/scene.json
          ls -la /tmp/*.png || true

      - name: Upload observability artifacts
        # WHY always: a failing pixel test is precisely when we need the image.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-${{ matrix.compiler }}
          path: |
            /tmp/scene.json
            /tmp/*.png
          if-no-files-found: warn
